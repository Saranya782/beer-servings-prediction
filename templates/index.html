<!DOCTYPE html>
<html>
<head>
    <title>Beer Servings Predictor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-4">
<div class="container">
    <h2 class="mb-4 text-center">🍺 Beer Servings & Alcohol Consumption Predictor</h2>
    
    <!-- Infographics -->
    <div class="row text-center mb-4">
        <div class="col-md-3"><div class="card p-3 shadow-sm"><h5>Countries</h5><h3>{{ stats.total_countries }}</h3></div></div>
        <div class="col-md-3"><div class="card p-3 shadow-sm"><h5>Avg Beer</h5><h3>{{ stats.avg_beer }}</h3></div></div>
        <div class="col-md-3"><div class="card p-3 shadow-sm"><h5>Avg Spirit</h5><h3>{{ stats.avg_spirit }}</h3></div></div>
        <div class="col-md-3"><div class="card p-3 shadow-sm"><h5>Avg Wine</h5><h3>{{ stats.avg_wine }}</h3></div></div>
    </div>

    <!-- Prediction Form -->
    <div class="card p-4 shadow-sm mb-4">
        <h4>Prediction Form</h4>
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Country</label>
                    <select name="country" class="form-select" required>
                        {% for c in countries %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Continent</label>
                    <select name="continent" class="form-select" required>
                        {% for cont in continents %}<option value="{{ cont }}">{{ cont }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Beer Servings</label>
                    <input type="number" step="1" name="beer_servings" class="form-control" value="150" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Spirit Servings</label>
                    <input type="number" step="1" name="spirit_servings" class="form-control" value="100" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Wine Servings</label>
                    <input type="number" step="1" name="wine_servings" class="form-control" value="50" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3 w-100">Predict Total Alcohol</button>
        </form>
        {% if prediction %}
        <div class="alert alert-success mt-4">
            <h5>Estimated Total Pure Alcohol: <strong>{{ prediction }}</strong></h5>
        </div>
        {% endif %}
    </div>
</div>
</body>
</html>
